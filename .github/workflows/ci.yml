name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Job 1: lint + build (rápido)
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build


  # Job 2: Testes de Governança (obrigatórios — bloqueiam merge)
  governance-tests:
    name: Governance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run governance tests
        run: bun vitest run src/lib/paymentFlow.test.ts --reporter=verbose

  # Job 3: Reset de senha E2E (obrigatório — bloqueia merge)
  # Garante que o fluxo solicitar link → definir senha → login imediato
  # nunca volte a quebrar com "credenciais inválidas" ou "link expirado".
  password-reset-e2e:
    name: Password Reset E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run password reset flow tests
        run: bun vitest run src/pages/__tests__/SetPassword.reset-flow.test.tsx --reporter=verbose

  # Job 4: Contratos do cálculo financeiro (obrigatório — bloqueia merge)
  # Garante que acatar ↔ undo continuam preservando bruto/líquido em pacotes
  # múltiplos, tabela diferenciada e overrides combinados. Qualquer mudança em
  # compute-company-financials, accept_payment_item ou undo_accept_payment_item
  # tem que sair aprovada por estes testes.
  financial-contract:
    name: Financial Accept/Undo Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run financial contract tests
        run: |
          bun vitest run \
            src/pages/__tests__/acceptItemGrossOverride.contract.test.ts \
            src/lib/__tests__/financialAcceptUndo.test.ts \
            src/lib/__tests__/packageAbsorbedEngine.contract.test.ts \
            --reporter=verbose

  # Job 5: Todos os testes (suite completa)
  test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all tests
        run: bun vitest run --reporter=verbose

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
