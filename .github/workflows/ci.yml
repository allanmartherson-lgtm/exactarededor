name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Job 1: typecheck + build (bloqueiam merge)
  # Separado do lint de propósito: o lint carrega ~2900 erros herdados e, quando
  # estava no mesmo job, falhava no primeiro passo e fazia o GitHub PULAR o
  # typecheck e o build — justamente os dois checks que pegam regressão real.
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  # Job 1b: lint (informativo por ora — NÃO bloqueia)
  # O passivo de ~2900 erros é anterior a este workflow e some aos poucos. O
  # `continue-on-error` mantém o resultado visível sem travar o pipeline
  # inteiro. Ao zerar o passivo, remover a linha e o lint volta a bloquear.
  lint:
    name: Lint (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint


  # Job 2: Testes de Governança (obrigatórios — bloqueiam merge)
  governance-tests:
    name: Governance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run governance tests
        run: bun vitest run src/lib/paymentFlow.test.ts --reporter=verbose

  # Job 3: Reset de senha E2E (obrigatório — bloqueia merge)
  # Garante que o fluxo solicitar link → definir senha → login imediato
  # nunca volte a quebrar com "credenciais inválidas" ou "link expirado".
  password-reset-e2e:
    name: Password Reset E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run password reset flow tests
        run: bun vitest run src/pages/__tests__/SetPassword.reset-flow.test.tsx --reporter=verbose

  # Job 4: Contratos do cálculo financeiro (obrigatório — bloqueia merge)
  # Garante que acatar ↔ undo continuam preservando bruto/líquido em pacotes
  # múltiplos, tabela diferenciada e overrides combinados. Qualquer mudança em
  # compute-company-financials, accept_payment_item ou undo_accept_payment_item
  # tem que sair aprovada por estes testes.
  financial-contract:
    name: Financial Accept/Undo Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run financial contract tests
        run: |
          bun vitest run \
            src/pages/__tests__/acceptItemGrossOverride.contract.test.ts \
            src/lib/__tests__/financialAcceptUndo.test.ts \
            src/lib/__tests__/packageAbsorbedEngine.contract.test.ts \
            --reporter=verbose

  # Job 5: Todos os testes (suite completa)
  test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all tests
        run: bun vitest run --reporter=verbose

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/

  # Job 6: Guard multi-tenant (obrigatório — bloqueia merge)
  # Falha se alguma RPC de leitura passar a ler payments sem filtrar por
  # current_active_hospital(), evitando regressão de vazamento entre hospitais.
  hospital-scope-guard:
    name: Hospital Scope Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit hospital scope (multi-tenant guard)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run scripts/audit-hospital-scope.ts

  # Job 7b: Guard de autenticação em edge functions (obrigatório — bloqueia merge)
  # Falha se qualquer edge function nova esquecer requireInternalOrRole e não
  # estiver na allowlist documentada de endpoints públicos intencionais.
  edge-auth-guard:
    name: Edge Function Auth Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Audit edge function auth
        run: deno run --allow-read scripts/audit-edge-auth.ts

  # Job 7: Testes de integração do motor de distribuição de pacotes (obrigatório — bloqueia merge)
  # Garante que o fluxo fim-a-fim (regras → matching → distribuição cirurgião/auxiliares
  # → fallback CBHPM → pacotes legados) não regrida silenciosamente. Cobre
  # packageRolesDistribution + packageDistribution_integration + analyze-payment.
  package-distribution-integration:
    name: Package Distribution Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run package distribution integration tests
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/_shared/packageRolesDistribution_test.ts \
            supabase/functions/_shared/packageDistribution_integration_test.ts \
            supabase/functions/_shared/rulesEngine_test.ts \
            supabase/functions/analyze-payment/bonus_confeccao_test.ts \
            supabase/functions/analyze-payment/bonus_per_attendance_test.ts \
            supabase/functions/analyze-payment/mixed_logic_test.ts \
            supabase/functions/analyze-payment/sector_reapply_recovery_test.ts \
            supabase/functions/analyze-payment/no_status_writeback_test.ts

  # Job 8: Login Google — redirect_uri em WebKit/Safari (obrigatório — bloqueia merge)
  # Garante que o botão "Entrar com Google" na tela /auth sempre envia
  # `redirect_uri = window.location.origin` (origin puro), mesmo com `?next=`
  # apontando para rota protegida ou consent OAuth. Concatenar `next` no
  # redirect_uri quebra o retorno `web_message` do @lovable.dev/cloud-auth-js
  # no Safari mobile (usuário fica preso em "conectando").
  auth-google-webkit:
    name: Auth Google (WebKit / Safari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright + WebKit
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps webkit

      - name: Start dev server
        run: |
          bun run dev &
          echo $! > /tmp/dev.pid
          # Espera o Vite responder na 8080.
          for i in {1..60}; do
            if curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              echo "dev server up"; exit 0
            fi
            sleep 1
          done
          echo "dev server did not start"; exit 1

      - name: Run Google OAuth redirect_uri contract (WebKit)
        env:
          E2E_BASE_URL: http://localhost:8080
        run: python tests/e2e/auth-google-safari.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-google-webkit-screenshots
          path: /tmp/browser/auth-google-safari/

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev.pid)" || true

